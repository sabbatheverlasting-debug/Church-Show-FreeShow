<!doctype html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Church Show Pro 2 – Startar</title>
    <link rel="stylesheet" href="global.css" />
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; background: #182d3c; color: #f5f1e7; }
        main { height:100vh; box-sizing:border-box; display:flex; align-items:center; justify-content:center; gap:28px; padding:32px; background:linear-gradient(125deg,#2d4c60,#182d3c); border-bottom:3px solid #c6a45d; -webkit-app-region:drag; }
        img { width:100px; height:100px; object-fit:contain; border-radius:20px; }
        h1 { margin:0 0 9px; font-size:28px; font-weight:600; letter-spacing:-0.5px; color:#f5f1e7; }
        h1 span { color:#d8bd82; }
        p { margin:0; font-size:14px; color:#cbdbe5; }
        .v { margin-top:10px; font-size:11px; opacity:0.65; }
        .activity { height:3px; width:170px; margin-top:20px; background:#426174; overflow:hidden; border-radius:3px; }
        .activity::after { content:""; display:block; height:100%; width:45%; background:#d8bd82; animation:loading 1.6s ease-in-out infinite; }
        @keyframes loading { from { transform:translateX(-100%); } to { transform:translateX(330%); } }
        @media (prefers-reduced-motion:reduce) { .activity::after { animation:none; width:100%; } }
    </style>
</head>
<body>
    <main>
        <img src="./icon.png" alt="Church Show" draggable="false" />
        <div>
            <h1>Church Show <span>Pro 2</span></h1>
            <p role="status">Startar din presentationsstudio…</p>
            <div class="activity" aria-hidden="true"></div>
            <p class="v">v<span class="version"></span></p>
        </div>
    </main>
        <script>
            const { ipcRenderer } = require("electron")

            ipcRenderer.send("MAIN", { channel: "VERSION" })
            ipcRenderer.once("MAIN", (e, msg) => {
                if (msg.channel !== "VERSION" || !msg.data) return
                document.querySelector(".version").textContent = msg.data
            })
        </script>
</body>
</html>
