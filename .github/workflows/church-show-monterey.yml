name: Church Show Pro 2 Intel Monterey
on:
  push:
    branches: [church-show-monterey]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install setuptools
      - run: npm ci
      - name: Church Show import tests
        run: npx vitest run --config config/testing/vitest.config.ts src/types/ChurchSongFooter.test.ts src/types/ChurchProgramBuilder.test.ts src/types/ChurchAudioMatch.test.ts src/electron/data/churchAudioFiles.test.ts src/types/ChurchCalendar.test.ts src/types/ChurchProjectMonths.test.ts src/electron/output/helpers/OutputDisplay.test.ts src/types/ChurchPackage.test.ts src/types/ChurchContentName.test.ts src/types/ChurchBible.test.ts src/types/ChurchUsx.test.ts src/types/ChurchEpub.test.ts src/electron/data/zip.test.ts src/types/ChurchStylePack.test.ts src/frontend/components/settings/tabs/churchThemes.test.ts src/frontend/utils/churchFolders.test.ts
      - name: Unit tests (record upstream failures)
        continue-on-error: true
        run: npm run test:unit
      - name: Compare unchanged upstream sync tests
        continue-on-error: true
        run: |
          cp src/electron/utils/files.ts /tmp/church-show-files.ts
          trap 'cp /tmp/church-show-files.ts src/electron/utils/files.ts' EXIT
          git show 436d4b634878ba723da1d1373637384ec700ce16:src/electron/utils/files.ts > /tmp/upstream-files.ts
          cp /tmp/upstream-files.ts src/electron/utils/files.ts
          npx vitest run --config config/testing/vitest.config.ts src/electron/cloud/syncManager.test.ts
      - run: npm run build
      - run: npx electron-builder --config config/building/church-show.yaml --mac dmg --x64 --publish never
      - name: Scan packaged app before executing it
        run: |
          brew install clamav
          mkdir -p /tmp/church-clamdb /tmp/church-scan
          printf 'DatabaseDirectory /tmp/church-clamdb\nDatabaseMirror database.clamav.net\n' > /tmp/church-freshclam.conf
          freshclam --config-file=/tmp/church-freshclam.conf
          node node_modules/@electron/asar/bin/asar.js extract "dist/mac/Church Show Pro 2.app/Contents/Resources/app.asar" /tmp/church-scan
          clamscan --database=/tmp/church-clamdb --recursive --infected --max-filesize=1024M --max-scansize=2048M --log=dist/security-scan.txt "dist/mac/Church Show Pro 2.app" /tmp/church-scan
          shasum -a 256 dist/*.dmg > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Church-Show-Security-Report
          path: |
            dist/security-scan.txt
            dist/SHA256SUMS.txt
          if-no-files-found: warn
      - name: Start the packaged Mac app
        run: node scripts/churchStartupSmoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Church-Show-Pro-2-Intel-Monterey
          path: dist/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Church-Show-Sangstund-Temapaket
          path: packages/Church-Show-Sangstund-Pro-2.zip
          if-no-files-found: error
