name: Church Show Intel Monterey
on:
  push:
    branches: [church-show-monterey]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install setuptools
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npx electron-builder --config config/building/church-show.yaml --mac dmg --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Church-Show-FreeShow-Intel-Monterey
          path: dist/*.dmg
          if-no-files-found: error
