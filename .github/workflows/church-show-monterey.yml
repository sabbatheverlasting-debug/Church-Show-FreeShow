name: Church Show Pro 2 Intel Monterey
on:
  push:
    branches: [church-show-monterey]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install setuptools
      - run: npm ci
      - name: Church Show import tests
        run: npx vitest run --config config/testing/vitest.config.ts src/types/ChurchPackage.test.ts src/types/ChurchContentName.test.ts src/types/ChurchBible.test.ts src/types/ChurchUsx.test.ts src/types/ChurchEpub.test.ts src/electron/data/zip.test.ts src/types/ChurchStylePack.test.ts src/frontend/components/settings/tabs/churchThemes.test.ts src/frontend/utils/churchFolders.test.ts
      - name: Unit tests (record upstream failures)
        continue-on-error: true
        run: npm run test:unit
      - name: Compare unchanged upstream sync tests
        continue-on-error: true
        run: |
          cp src/electron/utils/files.ts /tmp/church-show-files.ts
          trap 'cp /tmp/church-show-files.ts src/electron/utils/files.ts' EXIT
          git show 436d4b634878ba723da1d1373637384ec700ce16:src/electron/utils/files.ts > /tmp/upstream-files.ts
          cp /tmp/upstream-files.ts src/electron/utils/files.ts
          npx vitest run --config config/testing/vitest.config.ts src/electron/cloud/syncManager.test.ts
      - run: npm run build
      - run: npx electron-builder --config config/building/church-show.yaml --mac dmg --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Church-Show-Pro-2-Intel-Monterey
          path: dist/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Church-Show-Sangstund-Temapaket
          path: packages/Church-Show-Sangstund-1.zip
          if-no-files-found: error
